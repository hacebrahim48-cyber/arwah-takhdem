name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Check project
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd
          echo "===== FILES ====="
          ls -la
          echo "===== PUBSPEC ====="
          sed -n '1,80p' pubspec.yaml
          echo "===== MAIN DART ====="
          sed -n '1,10p' lib/main.dart

      - name: Create Flutter project
        run: |
          flutter create --project-name arwah_takhdem --platforms=android --no-pub .

      - name: Check files after create
        run: |
          echo "===== PUBSPEC AFTER FLUTTER CREATE ====="
          grep -n "supabase_flutter" pubspec.yaml || true
          echo "===== MAIN AFTER FLUTTER CREATE ====="
          sed -n '1,10p' lib/main.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Check Supabase dependency
        run: |
          echo "===== SUPABASE DEPENDENCY ====="
          flutter pub deps | grep supabase_flutter || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arwah-takhdem-apk
          path: build/app/outputs/flutter-apk/app-release.apk
